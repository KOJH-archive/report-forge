<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Report Forge 자료 제작</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#1d2c36;background:#f4f6f7;font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:76px;background:#fff;border-bottom:1px solid #dce3e7;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font-size:20px;font-weight:700;letter-spacing:-.5px}.brand small{font-size:12px;color:#647783;font-weight:400;margin-left:16px}.actions{display:flex;gap:9px}.button{padding:9px 16px;border:1px solid #cdd8df;background:#fff;border-radius:4px;color:#243d4b}.button.primary{background:#165d8c;color:#fff;border-color:#165d8c}.button:disabled{opacity:.5;cursor:wait}.layout{display:grid;grid-template-columns:230px minmax(320px,440px) minmax(380px,1fr);min-height:calc(100vh - 76px)}aside{background:#fff;border-right:1px solid #dce3e7;padding:24px 16px}.project-tab{width:100%;padding:13px;text-align:left;font-weight:700;border:0;background:#edf3f7;margin-bottom:20px;color:#165d8c}.nav-heading{font-size:11px;letter-spacing:1px;color:#718391;padding:0 12px}.block-list{padding:0;list-style:none;margin:12px 0 24px}.block-list button{width:100%;text-align:left;padding:12px;border:0;background:transparent;color:#3c505c;line-height:1.5}.block-list button.selected{background:#edf3f7;color:#165d8c}.block-list small{display:block;color:#788996;font-size:11px;margin-top:3px}.add-row{display:flex;gap:6px}.add-row select{width:140px}.editor{background:#fff;padding:28px 25px;border-right:1px solid #dce3e7}.editor h1{font-size:23px;letter-spacing:-.6px;margin:0 0 7px}.description{font-size:12px;color:#647783;line-height:1.8;margin:0 0 26px}label{display:block;font-size:12px;font-weight:700;margin-top:21px;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #cdd8df;border-radius:4px;background:#fff;padding:10px;color:#243d4b;outline:none}input:focus,textarea:focus,select:focus{border-color:#165d8c}textarea{resize:vertical;line-height:1.75;min-height:94px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.source-check{display:flex;align-items:flex-start;gap:7px;font-weight:400;margin:9px 0;font-size:12px;line-height:1.6}.source-check input{width:auto;margin-top:3px}.block-actions{display:flex;gap:6px;margin-top:28px;border-top:1px solid #e3e8eb;padding-top:18px}.block-actions button{font-size:12px;padding:7px 10px}.preview{padding:24px;min-width:0}.preview-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.preview-top h2{font-size:14px;margin:0}.preview-top span{font-size:11px;color:#647783}.preview iframe{width:100%;height:calc(100vh - 176px);min-height:600px;border:1px solid #dce3e7;background:#e9edf0}.empty{background:#fff;border:1px solid #dce3e7;padding:60px 30px;text-align:center;line-height:1.8;color:#647783}.status{margin:12px 0;font-size:12px;line-height:1.7;color:#647783}.status.error{color:#a02d2d;white-space:pre-wrap}.downloads{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.downloads a{text-decoration:none;background:#fff;color:#165d8c;border:1px solid #cdd8df;padding:8px 12px;border-radius:4px;font-size:12px}details{margin-top:24px;border-top:1px solid #e3e8eb;padding-top:15px}summary{font-size:12px;color:#647783;cursor:pointer}.advanced{font-family:monospace;font-size:12px;min-height:280px}.data-note{font-size:12px;background:#f4f6f7;padding:14px;line-height:1.8;overflow-wrap:anywhere}.comparison-item{margin-top:18px;padding-top:6px;border-top:1px solid #e3e8eb}.metric-choices{margin-top:10px}.loading{color:#647783;margin:24px}a{color:#165d8c}[hidden]{display:none!important}@media(max-width:1200px){.layout{grid-template-columns:200px minmax(320px,1fr)}.preview{grid-column:1/-1}.preview iframe{height:700px}.brand small{display:none}}@media(max-width:640px){header{height:auto;padding:18px;gap:14px;flex-wrap:wrap}.layout{display:block}aside{border-bottom:1px solid #dce3e7}.block-list{display:flex;overflow-x:auto;margin:8px 0}.block-list li{min-width:140px}.editor{padding:24px}.preview{padding:15px}.preview iframe{min-height:600px}.field-row{grid-template-columns:1fr}}
    .add-row select{flex:1;min-width:0;width:auto}.add-row .button{flex-shrink:0;padding:8px 10px;white-space:nowrap}
    .design-panel{margin-top:26px;padding-top:16px;border-top:1px solid #dce3e7}.design-panel h2{font-size:17px}.design-panel .description{margin-bottom:12px}.design-panel input[type=file]{font-size:12px}.design-actions{display:flex;gap:8px;margin:10px 0}.design-map{width:100%;background:#f4f6f7;border:1px solid #dce3e7;margin-top:12px}.role-item{border-top:1px solid #e3e8eb;padding-top:8px;margin-top:10px}.role-item small{display:block;font-size:11px;line-height:1.6;color:#647783;overflow-wrap:anywhere}.role-item label{margin-top:8px}.role-item select{font-size:12px}.design-warning{font-size:12px;line-height:1.7;color:#647783;margin-top:10px}
    header{position:sticky;top:0;z-index:10}
  </style>
</head>
<body>
  <header><div class="brand">Report Forge<small>원고 하나로 만드는 발표 자료와 보고서</small></div><div class="actions"><button class="button" id="save">원고 저장</button><button class="button" id="refresh">미리보기</button><button class="button primary" id="build">자료 내보내기</button></div></header>
  <div class="layout">
    <aside><button class="project-tab" id="project-tab">자료 정보</button><div class="nav-heading">목차와 원고</div><ol class="block-list" id="blocks"></ol><div class="add-row"><select id="new-type" aria-label="추가할 페이지 유형"></select><button class="button" id="add">추가</button></div><div class="status" id="sidebar-status"></div></aside>
    <div class="editor" id="editor"><p class="loading">원고를 불러오는 중입니다</p></div>
    <div class="preview"><div class="preview-top"><h2>자료 미리보기</h2><span id="page-count">원고를 준비하고 있습니다</span></div><div id="downloads" class="downloads"></div><div id="status" class="status" role="status" aria-live="polite"></div><iframe id="preview" title="발표 자료와 보고서 미리보기" sandbox="allow-scripts" hidden></iframe><div class="empty" id="empty">목차와 원고를 수정한 뒤 미리보기를 눌러 주세요<br>발표 자료와 보고서 보기를 전환할 수 있습니다</div></div>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    const labels = {summary:'핵심 요약',metrics:'주요 지표',chart:'차트와 해석',table:'수치 표',comparison:'선택지 비교',timeline:'실행 일정',text:'상세 설명',conclusion:'결론과 제안'};
    const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let report, token, selected = -1, dirty = false, busy = false, previewSequence = 0, design = null, designSlide = 1;
    const designKinds={cover:'표지',flow:'본문',metrics:'주요 지표',chart:'차트',table:'표',references:'참고 자료'};
    const roleLabels={clear:'기존 문구 지우기',keep:'디자인 문구 보존',title:'제목',lead:'핵심 문장 / 부제',body:'본문',footer:'출처 주석',page:'페이지 번호',meta:'작성자와 날짜',disclosure:'데이터 고지',unit:'차트 단위',note:'차트 해석'};
    for(let i=1;i<=3;i++)for(const [k,label] of Object.entries({label:'이름',value:'값',description:'설명'}))roleLabels[`metric${i}.${k}`]=`지표 ${i} ${label}`;
    const field = (id,label,value,type='input') => `<div class="field"><label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}">`}</div>`;
    function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
    function changed(){dirty=true;$('sidebar-status').textContent='저장하지 않은 변경 사항이 있습니다';$('downloads').replaceChildren();}
    function inputBind(id,fn){$(id)?.addEventListener('input',event=>{fn(event.target.value);changed();});}
    function selectHTML(id,values,current){return `<select id="${id}">${values.map(([value,label])=>`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(label)}</option>`).join('')}</select>`;}
    function renderNav(){
      $('blocks').innerHTML=report.sections.map((s,i)=>`<li><button data-index="${i}" class="${i===selected?'selected':''}">${i+1}. ${esc(s.title)}<small>${labels[s.type]}</small></button></li>`).join('');
      $('blocks').querySelectorAll('[data-index]').forEach(button=>button.onclick=()=>{selected=Number(button.dataset.index);render();});
      $('project-tab').style.background=selected===-1?'#edf3f7':'transparent';
    }
    function render(){renderNav();if(selected===-1)renderProject();else renderSection();}
    function renderProject(){
      $('editor').innerHTML=`<h1>자료 정보</h1><p class="description">발표 목적을 담은 제목과 사용할 서식을 설정합니다</p>${field('title','제목',report.title)}${field('subtitle','부제',report.subtitle)}<div class="field-row">${field('author','작성자',report.author)}${field('date','작성일',report.date)}</div><label for="theme">디자인 서식</label>${selectHTML('theme',[['corporate','회사 보고'],['editorial','개인 프로젝트']],report.theme||'corporate')}${field('disclosure','가정 또는 데이터 고지',report.disclosure,'textarea')}<div class="design-panel"><h2>회사 PPTX 디자인</h2><p class="description">기존 발표 자료를 올리면 원본 슬라이드의 배경·로고·글꼴·배치를 재사용합니다. 파일은 이 컴퓨터에 저장됩니다.</p><input id="company-file" type="file" accept=".pptx" aria-label="회사 PPTX 파일"><div class="design-actions"><button id="company-import" class="button">디자인 가져오기</button>${report.template?'<button id="company-remove" class="button">기본 서식 사용</button>':''}</div><div id="design-settings"></div></div><label>연결한 데이터</label><div class="data-note">${report.datasets.map(d=>`${esc(d.id)}: ${esc(d.file)}${d.sheet?` (${esc(d.sheet)})`:''}`).join('<br>')||'연결한 데이터가 없습니다'}</div><p class="description">CSV와 XLSX 파일을 원고 폴더에 넣고 연결할 수 있습니다. 새 데이터 연결과 지표 계산 방식은 아래 원고 전체 설정에서 수정합니다.</p><details><summary>원고 전체 설정</summary><p class="description">출처, 데이터 연결, 지표 계산 방식과 페이지별 세부 설정을 수정합니다</p><textarea class="advanced" id="advanced">${esc(JSON.stringify(report,null,2))}</textarea><button class="button" id="apply-json">전체 설정 적용</button></details>`;
      ['title','subtitle','author','date','disclosure'].forEach(key=>inputBind(key,v=>{report[key]=v;}));
      $('theme').onchange=event=>{report.theme=event.target.value;changed();};
      if(report.template)$('theme').previousElementSibling.textContent='Word 보고서 서식';
      $('apply-json').onclick=()=>{try{const candidate=JSON.parse($('advanced').value);if(!Array.isArray(candidate.sections))throw new Error('목차가 필요합니다');report=candidate;design=null;changed();render();operation(loadDesign);status('전체 설정을 적용했습니다. 미리보기에서 원고를 확인해 주세요');}catch(error){status(`설정을 적용하지 못했습니다: ${error.message}`,true);}};
      $('company-import').onclick=()=>operation(async()=>{
        const file=$('company-file').files[0];if(!file)throw new Error('회사 PPTX 파일을 선택해 주세요');if(file.size>40*1024*1024)throw new Error('PPTX 파일은 40MB 이하여야 합니다');
        status('회사 PPTX의 슬라이드와 디자인을 분석하고 있습니다');
        const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('파일을 읽지 못했습니다'));reader.readAsDataURL(file);});
        const result=await post('/api/template/import',{name:file.name,data});report.template=result.template;design=result.design;designSlide=1;changed();render();status('회사 디자인을 가져왔습니다. 페이지 유형과 텍스트 역할을 확인한 뒤 미리보기를 눌러 주세요');
      });
      if($('company-remove'))$('company-remove').onclick=()=>{delete report.template;design=null;changed();render();status('기본 서식을 사용합니다');};
      renderDesign();
    }
    async function loadDesign(){if(!report.template){design=null;return;}const result=await post('/api/template/inspect');design=result.design;if(selected===-1)renderDesign();}
    function renderDesign(){
      const target=$('design-settings');if(!target||!report.template)return;
      if(!design){target.textContent='디자인 정보를 불러오는 중입니다';return;}
      const slides=design.slides;
      target.innerHTML=`<div class="data-note">${slides.length}장 · ${design.width.toFixed(2)} × ${design.height.toFixed(2)} 인치<br>${esc(report.template.file)}</div><p class="design-warning">페이지 유형에 사용할 원본을 선택합니다. 표는 기본적으로 열 개수가 맞는 원본을 자동 선택합니다. 차트는 원본과 같은 선/막대 형태를 사용합니다.</p>${Object.entries(designKinds).map(([kind,label])=>`<label for="layout-${kind}">${label}에 사용할 원본</label>${selectHTML(`layout-${kind}`,[['auto','자동 선택'],...slides.map(s=>[String(s.index),`${s.index}번 · ${s.shapes.find(n=>s.roles[n.id]==='title')?.text.slice(0,24)||'슬라이드'}`])],String(report.template.layouts?.[kind]??'auto'))}`).join('')}<details open><summary>텍스트 교체 위치 확인</summary><label for="design-slide">확인할 원본 슬라이드</label>${selectHTML('design-slide',slides.map(s=>[String(s.index),`${s.index}번 슬라이드`]),String(designSlide))}<div id="role-settings"></div></details><p class="design-warning">배경·사진·로고·마스터와 “디자인 문구 보존”은 그대로 남습니다. 원고 미리보기는 내용 확인용이며 회사 디자인은 내보낸 PowerPoint에 적용됩니다.${design.warnings.length?'<br>'+design.warnings.map(esc).join('<br>'):''}</p>`;
      Object.keys(designKinds).forEach(kind=>$(`layout-${kind}`).onchange=e=>{report.template.layouts??={};if(e.target.value==='auto')delete report.template.layouts[kind];else report.template.layouts[kind]=Number(e.target.value);changed();});
      $('design-slide').onchange=e=>{designSlide=Number(e.target.value);renderRoles();};renderRoles();
    }
    function renderRoles(){
      const slide=design.slides[designSlide-1];if(!slide)return;const effective={...slide.roles,...report.template.roles?.[designSlide]};
      const text=slide.shapes.filter(s=>s.type==='text'&&!s.grouped);
      $('role-settings').innerHTML=`<svg class="design-map" viewBox="0 0 ${design.width*100} ${design.height*100}" role="img" aria-label="텍스트 위치 지도">${slide.shapes.filter(s=>s.w>0&&s.h>0).map(s=>`<g><rect x="${s.x*100}" y="${s.y*100}" width="${s.w*100}" height="${s.h*100}" fill="${s.type==='text'?'#edf3f7':'#dce3e7'}" stroke="#91a9b8" stroke-width="1"/><text x="${s.x*100+5}" y="${s.y*100+18}" font-size="13" fill="#243d4b">${esc(s.id)} · ${esc(roleLabels[effective[s.id]]||({chart:'차트',table:'표',image:'이미지'}[s.type]||'도형'))}</text></g>`).join('')}</svg>${text.map(s=>`<div class="role-item"><label for="role-${s.id}">${esc(s.id)} · ${esc(s.name)}</label><small>${esc(s.text.slice(0,180))||'빈 텍스트 상자'}</small>${selectHTML(`role-${s.id}`,Object.entries(roleLabels),effective[s.id]||'clear')}</div>`).join('')}`;
      text.forEach(s=>$(`role-${s.id}`).onchange=e=>{report.template.roles??={};report.template.roles[designSlide]??={};report.template.roles[designSlide][s.id]=e.target.value;changed();renderRoles();});
    }
    function renderSection(){
      const s=report.sections[selected];
      let special='';
      if(['chart','table'].includes(s.type))special+=`<label for="dataset">사용할 데이터</label>${selectHTML('dataset',report.datasets.map(d=>[d.id,`${d.id} (${d.file})`]),s.dataset)}`;
      if(s.type==='chart')special+=`<div class="field-row"><div><label for="chart-type">차트 형태</label>${selectHTML('chart-type',[['line','추세 선 그래프'],['bar','비교 막대그래프']],s.chartType)}</div>${field('unit','단위',s.unit)}</div>${field('label-column','범주 이름 열',s.labelColumn)}${field('series','비교할 수치 열',s.series.map(v=>v.column).join('\n'),'textarea')}<p class="description">원본의 열 이름을 한 줄에 하나씩 적습니다. 최대 3개를 비교할 수 있습니다.</p>`;
      if(s.type==='table')special+=field('columns','표에 표시할 열',s.columns.join('\n'),'textarea');
      if(s.type==='metrics')special+=`<label>표시할 지표</label><div class="metric-choices">${(report.metrics||[]).map(m=>`<label class="source-check"><input type="checkbox" name="metric" value="${esc(m.id)}" ${(s.metricIds||[]).includes(m.id)?'checked':''}>${esc(m.label)}</label>`).join('')}</div><p class="description">최대 3개의 지표를 선택합니다. 숫자는 원본 데이터에서 계산합니다.</p>`;
      if(s.type==='comparison')special+=s.options.map((o,i)=>`<div class="comparison-item">${field(`option-${i}`,'선택지',o.name)}${field(`strength-${i}`,'기대 효과',o.strength,'textarea')}${field(`tradeoff-${i}`,'검토할 점',o.tradeoff,'textarea')}</div>`).join('');
      if(s.type==='timeline')special+=s.steps.map((step,i)=>`<div class="comparison-item"><div class="field-row">${field(`when-${i}`,'시점',step.when)}${field(`owner-${i}`,'담당',step.owner)}</div>${field(`step-${i}`,'실행 내용',step.title)}</div>`).join('');
      $('editor').innerHTML=`<h1>${labels[s.type]}</h1><p class="description">각 페이지에서 전달할 메시지와 근거를 정리합니다</p>${field('block-title','페이지 제목',s.title)}${field('lead','핵심 문장',s.lead,'textarea')}${special}${field('body','상세 설명', (s.body||[]).join('\n\n'),'textarea')}${field('bullets','핵심 항목', (s.bullets||[]).join('\n'),'textarea')}<p class="description">상세 설명은 빈 줄로, 핵심 항목은 줄바꿈으로 나눕니다. {{지표id}}를 쓰면 계산한 값이 들어갑니다.</p><label>참고 자료</label>${report.sources.map(source=>`<label class="source-check"><input type="checkbox" name="source" value="${esc(source.id)}" ${(s.sourceIds||[]).includes(source.id)?'checked':''}>${esc(source.title)}</label>`).join('')}<p class="description">차트와 표는 원본 데이터의 출처를 자동으로 연결합니다</p><div class="block-actions"><button class="button" id="up">위로</button><button class="button" id="down">아래로</button><button class="button" id="duplicate">복제</button><button class="button" id="remove">삭제</button></div>`;
      inputBind('block-title',v=>{s.title=v;renderNav();});inputBind('lead',v=>{s.lead=v;});
      inputBind('body',v=>{s.body=v.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);});inputBind('bullets',v=>{s.bullets=v.split('\n').map(x=>x.trim()).filter(Boolean);});
      if($('dataset'))$('dataset').onchange=event=>{s.dataset=event.target.value;changed();};
      if(s.type==='chart'){$('chart-type').onchange=e=>{s.chartType=e.target.value;changed();};inputBind('unit',v=>{s.unit=v;});inputBind('label-column',v=>{s.labelColumn=v;});inputBind('series',v=>{s.series=v.split('\n').map(x=>x.trim()).filter(Boolean).map(column=>({column,name:column}));});}
      if(s.type==='table')inputBind('columns',v=>{s.columns=v.split('\n').map(x=>x.trim()).filter(Boolean);});
      $('editor').querySelectorAll('[name=metric]').forEach(input=>input.onchange=()=>{s.metricIds=[...$('editor').querySelectorAll('[name=metric]:checked')].map(i=>i.value);changed();});
      $('editor').querySelectorAll('[name=source]').forEach(input=>input.onchange=()=>{s.sourceIds=[...$('editor').querySelectorAll('[name=source]:checked')].map(i=>i.value);changed();});
      if(s.type==='comparison')s.options.forEach((o,i)=>{inputBind(`option-${i}`,v=>{o.name=v;});inputBind(`strength-${i}`,v=>{o.strength=v;});inputBind(`tradeoff-${i}`,v=>{o.tradeoff=v;});});
      if(s.type==='timeline')s.steps.forEach((step,i)=>{inputBind(`when-${i}`,v=>{step.when=v;});inputBind(`owner-${i}`,v=>{step.owner=v;});inputBind(`step-${i}`,v=>{step.title=v;});});
      $('up').disabled=selected===0;$('down').disabled=selected===report.sections.length-1;
      $('up').onclick=()=>{[report.sections[selected],report.sections[selected-1]]=[report.sections[selected-1],report.sections[selected]];selected--;changed();render();};
      $('down').onclick=()=>{[report.sections[selected],report.sections[selected+1]]=[report.sections[selected+1],report.sections[selected]];selected++;changed();render();};
      $('duplicate').onclick=()=>{report.sections.splice(selected+1,0,structuredClone(s));selected++;changed();render();};
      $('remove').onclick=()=>{if(report.sections.length===1){status('목차에는 최소 한 개의 페이지가 필요합니다',true);return;}report.sections.splice(selected,1);selected=Math.min(selected,report.sections.length-1);changed();render();};
    }
    async function post(endpoint,payload={report}){const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','X-Report-Forge-Token':token},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw new Error([result.error,...(result.issues||[])].join('\n'));return result;}
    async function operation(action){if(busy)return;busy=true;['refresh','save','build'].forEach(id=>$(id).disabled=true);try{await action();}catch(error){status(error.message,true);}finally{busy=false;['refresh','save','build'].forEach(id=>$(id).disabled=false);}}
    async function preview(){const sequence=++previewSequence;status('원고와 데이터를 확인하고 있습니다');const result=await post('/api/preview');if(sequence!==previewSequence)return;$('preview').srcdoc=result.html;$('preview').hidden=false;$('empty').hidden=true;$('page-count').textContent=`발표 자료 ${result.slides}장${result.companyDesign?' · 회사 디자인 적용 예정':''}` ;status(result.warnings.length?result.warnings.join('\n'):'미리보기를 갱신했습니다');}
    $('project-tab').onclick=()=>{selected=-1;render();};
    $('refresh').onclick=()=>operation(preview);
    $('save').onclick=()=>operation(async()=>{await post('/api/save');dirty=false;$('sidebar-status').textContent='원고를 저장했습니다';status('원고 파일을 저장했습니다');});
    $('build').onclick=()=>operation(async()=>{status('발표 자료와 보고서를 만들고 있습니다');const result=await post('/api/build');const names={'presentation.pptx':'PowerPoint','report.docx':'Word 보고서','evidence.xlsx':'엑셀 근거 자료','preview.html':'미리보기 열기'};$('downloads').innerHTML=result.files.filter(f=>names[f.name]).map(f=>`<a href="${esc(f.url)}" ${f.name==='preview.html'?'target="_blank" rel="noopener"':'download'}>${names[f.name]}</a>`).join('');$('page-count').textContent=`발표 자료 ${result.slides}장`;status('자료를 생성했습니다. 내려받은 Office 파일에서 최종 표시를 확인해 주세요');});
    $('new-type').innerHTML=Object.entries(labels).map(([type,label])=>`<option value="${type}">${label}</option>`).join('');
    $('add').onclick=()=>{const type=$('new-type').value;const sourceIds=report.sources.slice(0,1).map(s=>s.id);const section={type,title:labels[type],sourceIds};const dataset=report.datasets[0]?.id||'데이터id';if(type==='chart')Object.assign(section,{dataset,chartType:'line',labelColumn:'월',series:[{column:'온라인',name:'온라인'}],unit:'백만원'});else if(type==='table')Object.assign(section,{dataset,columns:['월','온라인']});else if(type==='metrics')section.metricIds=(report.metrics||[]).slice(0,3).map(m=>m.id);else if(type==='comparison')section.options=[{name:'선택지 A',strength:'기대 효과',tradeoff:'검토할 점'},{name:'선택지 B',strength:'기대 효과',tradeoff:'검토할 점'}];else if(type==='timeline')section.steps=[{when:'1주차',title:'실행 내용',owner:'담당자'}];else section.body=['여기에 전달할 내용을 작성합니다'];report.sections.push(section);selected=report.sections.length-1;changed();render();};
    window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
    fetch('/api/project').then(r=>r.json()).then(data=>{report=data.report;token=data.token;render();return operation(async()=>{await loadDesign();await preview();});}).catch(error=>status(error.message,true));
  </script>
</body>
</html>
